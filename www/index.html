<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Incognito</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <audio id="soundClick" src="sounds/click.mp3"></audio>
  <audio id="soundFlip" src="sounds/flip.mp3"></audio>
  <audio id="soundWin" src="sounds/win.mp3"></audio>
  <audio id="soundLose" src="sounds/lose.mp3"></audio>

  <div id="ejectionOverlay" class="full-overlay" style="display: none;">
    <div class="result-card">
      <div id="resultIcon" style="font-size: 4rem;"></div>
      <h1 id="resultTitle" class="result-title">---</h1>
      <p id="resultSubtitle" style="margin-bottom:20px;">---</p>
      
      <div style="background:#0f172a; padding:10px; border-radius:10px; margin-bottom:20px; display:none;">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>Palabra:</span><span id="finalSecretWord" style="font-weight:bold;">---</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
            <span>Impostores:</span><span id="finalImpostors" style="font-weight:bold; color:#f87171;">---</span>
        </div>
      </div>
      
      <button id="btnBackToLobby" class="btn-main btn-primary" style="width:100%" onclick="document.getElementById('ejectionOverlay').style.display='none'">CONTINUAR</button>
    </div>
  </div>

  <div id="lobbyOverlay" class="lobby-overlay">
    <div id="screenHome" class="screen-wrapper-home">
      <div class="big-logo-container"><img src="images/logo.png" style="width:280px; max-width:80vw;"></div>
      <div class="home-card-buttons">
        <button id="btnGoCreate" class="btn-big btn-main btn-primary">CREAR SALA</button>
        <button id="btnGoJoin" class="btn-big btn-main btn-secondary">UNIRSE</button>
        <button id="btnPremium" class="btn-big btn-gold">PREMIUM ⭐</button>
        <button id="btnHowToPlay" class="btn-main btn-secondary" style="width:auto; align-self:center;">?</button>
      </div>
    </div>

    <div id="screenCreate" class="screen" style="display:none;">
      <div class="screen-header"><button id="backFromCreate" class="btn-icon-back"><</button><h2>Crear</h2></div>
      <input type="text" id="hostName" class="input-modern" placeholder="Tu Nombre">
      
      <div class="config-counters">
        <div class="mini-card"><span class="mini-label">JUGADORES</span><div class="mini-controls"><button class="btn-circle" onclick="adjustValue('maxPlayers', -1)">-</button><span id="displayPlayers">10</span><button class="btn-circle" onclick="adjustValue('maxPlayers', 1)">+</button></div></div>
        <div class="mini-card"><span class="mini-label">IMPOSTORES</span><div class="mini-controls"><button class="btn-circle" onclick="adjustValue('impostors', -1)">-</button><span id="displayImpostors">2</span><button class="btn-circle" onclick="adjustValue('impostors', 1)">+</button></div></div>
        <div class="mini-card"><span class="mini-label">TIEMPO</span><div class="mini-controls"><button class="btn-circle" onclick="adjustValue('timeVote', -15)">-</button><span id="displayVoteTime">120</span><button class="btn-circle" onclick="adjustValue('timeVote', 15)">+</button></div></div>
      </div>
      <input type="hidden" id="maxPlayers" value="10"><input type="hidden" id="impostors" value="2"><input type="hidden" id="timeVote" value="120">

      <button id="btnOpenCategories" class="btn-main btn-secondary">Elegir Categorías</button>
      <div style="display:flex; gap:10px; margin-top:10px;">
          <div id="modeGroup" class="mode-button selected-mode" style="flex:1;">Grupal</div>
          <div id="modeText" class="mode-button" style="flex:1;">Texto</div>
      </div>
      <button id="btnCreateRoom" class="btn-big btn-main btn-primary" style="margin-top:15px;">CREAR</button>
    </div>

    <div id="screenJoin" class="screen" style="display:none;">
      <div class="screen-header"><button id="backFromJoin" class="btn-icon-back"><</button><h2>Unirse</h2></div>
      <input type="text" id="joinName" class="input-modern" placeholder="Nombre">
      <input type="text" id="joinCode" class="input-modern" placeholder="CÓDIGO" style="text-transform:uppercase;">
      <button id="btnJoinRoom" class="btn-big btn-main btn-primary">ENTRAR</button>
    </div>

    <div id="screenCategories" class="screen" style="display:none;">
      <div class="screen-header"><button id="backFromCategories" class="btn-icon-back"><</button><h2>Categorías</h2></div>
      <div id="categoriesGrid" class="categories-grid"></div>
      <button id="btnSaveCategories" class="btn-big btn-main btn-primary">GUARDAR</button>
    </div>
  </div>

  <main id="mainContent" style="display:none;">
    <div class="main-layout">
      <div class="top-bar">
        <div>SALA <span id="roomCodeDisplay" style="color:#ef4444; font-weight:900;">---</span> <button id="btnCopyCode" style="background:none;border:none;color:#fff;">📋</button></div>
        <button id="btnExit" class="btn-exit-red">Salir</button>
      </div>

      <div class="main-grid">
        <section class="view-panel">
          <div id="viewLobby">
            <h2>Esperando...</h2>
            <div style="display:flex; gap:20px; justify-content:center; margin:20px 0;">
                <div><span id="currentPlayersCount" class="stat-value">1</span><br>Jugadores</div>
                <div><span id="currentImpostorsCount" class="stat-value">1</span><br>Impostores</div>
            </div>
            <button id="btnStartRound" class="btn-main btn-primary" style="display:none;">INICIAR PARTIDA</button>
          </div>

          <div id="viewWord" style="display:none;">
            <div id="cardContainer" class="secret-card-container">
              <div id="secretCardInner" class="secret-card-inner">
                <div class="secret-card-face front"><h1>🕵️</h1><p>TOCA</p></div>
                <div class="secret-card-face back"><span id="roleTitle" class="role-badge">ROL</span><h1 id="secretWordDisplay">---</h1><p id="wordHint">...</p></div>
              </div>
            </div>
          </div>

          <div id="viewTurn" style="display:none;">
            <h2>Turno de <span id="currentTurnPlayer">...</span></h2>
            <div id="cluesHistoryContainer" class="app-card" style="display:none; max-height:150px; overflow-y:auto;"><div id="cluesHistory"></div></div>
            
            <div id="turnInputArea" style="display:none;">
                <input type="text" id="inputClue" class="input-modern" placeholder="Pista...">
                <button id="btnSendClue" class="btn-main btn-primary">ENVIAR</button>
            </div>
            <div id="turnActionsNormal" style="display:none;">
                <button id="btnEndTurn" class="btn-main btn-primary">YA HABLÉ</button>
            </div>
            <div id="turnWaitMessage" style="color:#cbd5e1;">Esperando...</div>
          </div>

          <div id="viewVote" style="display:none;">
            <h2>Votación</h2>
            <p id="voteSubtitle">¿Quién miente?</p>
            <div id="votePlayersGrid" class="categories-grid"></div>
            <button id="btnSkipVote" class="btn-main btn-secondary" style="margin-top:15px;">SALTAR</button>
          </div>
        </section>

        <aside class="sidebar-panel">
          <div class="sidebar-card"><h3>TIEMPO</h3><div id="timerNumber" class="timer-display-sidebar">--</div></div>
          <div class="sidebar-card" style="flex:1; justify-content:flex-start;">
              <h3>AGENTES</h3>
              <div id="playersList" class="players-list"></div>
          </div>
          <div class="sidebar-card"><p id="statusText">...</p></div>
        </aside>
      </div>
    </div>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
